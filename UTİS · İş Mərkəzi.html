<!DOCTYPE html>
<html lang="az"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UTİS · İş Mərkəzi</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f7f9;--card:#fff;--tx:#1c2430;--mut:#667085;--ac:#0b6e4f;--bd:#d9dee5;--err:#b42318}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#19212b;--tx:#e8ecf1;--mut:#98a2b3;--ac:#3ec28f;--bd:#2c3744;--err:#f97066}}
:root[data-theme="dark"]{--bg:#10151c;--card:#19212b;--tx:#e8ecf1;--mut:#98a2b3;--ac:#3ec28f;--bd:#2c3744;--err:#f97066}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:12px 14px;font-weight:700;border-bottom:1px solid var(--bd);background:var(--card)}
header small{display:block;font-weight:400;color:var(--mut)}
main{padding:12px;max-width:900px;margin:auto}
nav{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
nav button{white-space:nowrap}
button,input,select,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
button{cursor:pointer}button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.row>*{flex:1;min-width:120px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}th{color:var(--mut);font-weight:600}
td.n,th.n{text-align:right}.mut{color:var(--mut)}.err{color:var(--err)}
.cl{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}
textarea{width:100%;min-height:90px}
</style></head><body>
<header>UTİS · İş Mərkəzi<small id="sub">Müştəri seçilməyib</small></header>
<main><nav id="nav"></nav><div id="v"></div></main>
<script>
const TABS=[["cl","Müştərilər"],["inv","E-qaimələr"],["vat","ƏDV"],["jr","Jurnal"],["tb","Saldo"],["pay","Əmək haqqı"],["sv","Xidmətlər"]];
// DƏRƏCƏ VƏ HESABLAR: sadələşdirilmiş nümunədir, rəsmi mənbə ilə yoxlayın
const ACC={deb:"211",kred:"531",sales:"601",exp:"711",vo:"521",vi:"241"};
const R={inc:.14,dsE:.03,dsR:.22,unE:.005,unR:.005,mdE:.02,mdR:.02};
const SERV=["Qeydiyyat","E-qaimə yoxlaması","ƏDV bəyannaməsi","Mühasibat uçotu","Əmək haqqı","Maliyyə hesabatı","Hüquqi məsləhət"];
let S={clients:[],services:[],cur:null,tab:"cl",op:"operator"};
try{const x=localStorage.getItem("utis_jc");if(x)S=Object.assign(S,JSON.parse(x))}catch(e){}
const save=()=>{try{localStorage.setItem("utis_jc",JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const cur=()=>S.clients.find(c=>c.voen===S.cur);
const f2=n=>(+n||0).toLocaleString("az",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tbl=(h,rows,num=[])=>`<div class="sc"><table><tr>${h.map((x,i)=>`<th class="${num.includes(i)?"n":""}">${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map((x,i)=>`<td class="${num.includes(i)?"n":""}">${esc(x)}</td>`).join("")}</tr>`).join("")}</table></div>`;
function go(t){S.tab=t;save();draw()}
function draw(){
  const c=cur();$("sub").textContent=c?`${c.name} · VÖEN ${c.voen}`:"Müştəri seçilməyib";
  $("nav").innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("");
  const need=!c&&!["cl","sv"].includes(S.tab);
  $("v").innerHTML=need?'<div class="card mut">Əvvəlcə «Müştərilər» bölməsindən müştəri seçin.</div>':V[S.tab](c);
}
const V={
cl(){return `<div class="card"><b>Yeni müştəri</b><div class="row" style="margin-top:8px">
<input id="nv" placeholder="VÖEN (10 rəqəm)" inputmode="numeric" maxlength="10"><input id="nn" placeholder="Ad">
<select id="nk"><option>Hüquqi şəxs</option><option>Fərdi sahibkar</option></select></div>
<button class="pri" onclick="addC()">Əlavə et</button> <span id="msg" class="err"></span></div>
<div class="card"><b>Müştərilər (${S.clients.length})</b>${S.clients.map(c=>`<div class="cl" onclick="pick('${c.voen}')"><span>${esc(c.name)}<br><small class="mut">${c.voen} · ${c.kind}</small></span><span>${c.voen===S.cur?"✔ seçilib":"Seç"}</span></div>`).join("")||'<p class="mut">Hələ müştəri yoxdur.</p>'}</div>`},
inv(c){return `<div class="card"><b>CSV idxalı</b><p class="mut">Sütunlar: date,number,direction(in|out),voen,name,amount,vat</p>
<input type="file" id="fl" accept=".csv,text/csv" onchange="fileIn(this)"><p class="mut">və ya buraya yapışdırın:</p>
<textarea id="ta" placeholder="2026-01-10,AA-0001,out,1234567891,Nümunə MMC,1180,180"></textarea>
<div class="row"><button class="pri" onclick="imp($('ta').value)">Yüklə</button><button onclick="sample()">Nümunə doldur</button></div><span id="msg" class="mut"></span></div>
<div class="card">${tbl(["Tarix","№","İst.","Kontragent","Məbləğ","ƏDV"],c.inv.map(i=>[i.date,i.number,i.dir,i.name,f2(i.amount),f2(i.vat)]),[4,5])}</div>`},
vat(c){const m={};c.inv.forEach(i=>{const k=i.date.slice(0,7);m[k]=m[k]||[0,0];m[k][i.dir==="out"?0:1]+=i.vat});
return `<div class="card">${tbl(["Ay","Çıxan ƏDV","Daxil olan","Ödənilməli"],Object.keys(m).sort().map(k=>[k,f2(m[k][0]),f2(m[k][1]),f2(m[k][0]-m[k][1])]),[1,2,3])}</div>`},
jr(c){return `<div class="card"><button class="pri" onclick="post()">E-qaimələrdən avtomatik yazılış</button>
<div class="row" style="margin-top:10px"><input id="md" type="date"><input id="mdb" placeholder="Debet"><input id="mcr" placeholder="Kredit"><input id="mam" placeholder="Məbləğ" inputmode="decimal"><input id="mnt" placeholder="Qeyd"></div>
<button onclick="manual()">Əl ilə yazılış</button></div>
<div class="card">${tbl(["Tarix","Debet","Kredit","Məbləğ","Qeyd"],c.ent.map(e=>[e.date,e.d,e.c,f2(e.a),e.n]),[3])}</div>`},
tb(c){const a={};c.ent.forEach(e=>{(a[e.d]=a[e.d]||[0,0])[0]+=e.a;(a[e.c]=a[e.c]||[0,0])[1]+=e.a});
return `<div class="card">${tbl(["Hesab","Debet","Kredit","Saldo"],Object.keys(a).sort().map(k=>[k,f2(a[k][0]),f2(a[k][1]),f2(a[k][0]-a[k][1])]),[1,2,3])}</div>`},
pay(){return `<div class="card"><p class="err">Dərəcələr sadələşdirilmişdir — rəsmi dərəcələrlə yoxlayın.</p>
<div class="row"><input id="g" value="1000" inputmode="decimal" oninput="calc()"></div><div id="po"></div></div>`},
sv(){return `<div class="card"><b>Xidmət qeyd et</b><div class="row" style="margin-top:8px">
<select id="ss">${S.clients.map(c=>`<option value="${c.voen}" ${c.voen===S.cur?"selected":""}>${esc(c.name)}</option>`).join("")}</select>
<select id="st">${SERV.map(x=>`<option>${x}</option>`).join("")}</select>
<input id="so" placeholder="Operator" value="${esc(S.op)}"><input id="sn" placeholder="Qeyd"></div>
<button class="pri" onclick="addS()">Yadda saxla</button></div>
<div class="card">${tbl(["Tarix","VÖEN","Xidmət","Operator","Qeyd"],S.services.slice().reverse().map(s=>[s.date,s.voen,s.svc,s.op,s.note]))}</div>`}
};
function addC(){const v=$("nv").value.trim(),n=$("nn").value.trim();
  if(!/^\d{10}$/.test(v)||!n)return $("msg").textContent="VÖEN 10 rəqəm və ad tələb olunur.";
  if(S.clients.some(c=>c.voen===v))return $("msg").textContent="Bu VÖEN artıq var.";
  S.clients.push({voen:v,name:n,kind:$("nk").value,inv:[],ent:[]});S.cur=v;save();draw()}
function pick(v){S.cur=v;save();draw()}
function imp(t){const c=cur();let n=0,bad=0;
  t.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(l=>{const p=l.split(/[,;]/).map(x=>x.trim());
    if(p[0]==="date")return;const[d,num,dir,vo,nm,am,vt]=p;
    if(!/^\d{4}-\d\d-\d\d/.test(d)||!["in","out"].includes((dir||"").toLowerCase())||isNaN(+am)||isNaN(+vt)){bad++;return}
    if(c.inv.some(i=>i.number===num&&i.dir===dir.toLowerCase()&&i.voen===vo))return;
    c.inv.push({date:d,number:num,dir:dir.toLowerCase(),voen:vo,name:nm,amount:+am,vat:+vt,posted:false});n++});
  save();draw();$("msg").textContent=`${n} yeni qaimə əlavə olundu${bad?`, ${bad} sətir oxunmadı`:""}.`}
function fileIn(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>imp(r.result);r.readAsText(f)}
function sample(){$("ta").value="2026-01-10,AA-0001,out,1234567891,Nümunə MMC,1180,180\n2026-01-15,AA-0002,in,9876543211,Təchizatçı QSC,590,90\n2026-02-03,AA-0003,out,1234567891,Nümunə MMC,2360,360\n2026-02-20,AA-0004,in,9876543211,Təchizatçı QSC,1180,180"}
function post(){const c=cur();c.inv.filter(i=>!i.posted).forEach(i=>{const net=+(i.amount-i.vat).toFixed(2),n=i.number+" · "+i.name;
  const es=i.dir==="out"?[[ACC.deb,ACC.sales,net],[ACC.deb,ACC.vo,i.vat]]:[[ACC.exp,ACC.kred,net],[ACC.vi,ACC.kred,i.vat]];
  es.filter(e=>e[2]).forEach(e=>c.ent.push({date:i.date,d:e[0],c:e[1],a:e[2],n}));i.posted=true});save();draw()}
function manual(){const c=cur(),a=parseFloat($("mam").value.replace(",","."));
  if(!$("md").value||!$("mdb").value||!$("mcr").value||isNaN(a))return;
  c.ent.push({date:$("md").value,d:$("mdb").value.trim(),c:$("mcr").value.trim(),a,n:$("mnt").value});save();draw()}
function calc(){const g=parseFloat($("g").value.replace(",","."))||0,e=g*(R.dsE+R.unE+R.mdE),t=(g-e)*R.inc,r=g*(R.dsR+R.unR+R.mdR);
  $("po").innerHTML=tbl(["Göstərici","AZN"],[["Brutto",f2(g)],["İşçi tutulmaları",f2(e)],["Gəlir vergisi",f2(t)],["Xalis (ələ verilən)",f2(g-e-t)],["İşəgötürən payı",f2(r)],["İşəgötürənin ümumi xərci",f2(g+r)]],[1])}
function addS(){if(!$("ss").value)return;S.op=$("so").value;S.services.push({date:new Date().toISOString().slice(0,10),voen:$("ss").value,svc:$("st").value,op:S.op,note:$("sn").value});save();draw()}
const _d=draw;draw=function(){_d();if(S.tab==="pay"&&cur())calc()};
draw();
</script></body></html>
